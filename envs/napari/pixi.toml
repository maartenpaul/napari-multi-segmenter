[workspace]
name = "multi-segmenter-napari"
channels = ["conda-forge"]
platforms = [
  { name = "linux-64-cuda", platform = "linux-64", cuda = "12.8" },
  { name = "linux-64-amd", platform = "linux-64" },
]

[dependencies]
python = "3.12.*"
micro_sam = ">=2,<3"
pytorch = ">=2.7.1,<3"
pyqt = "*"
zeroc-ice = ">=3.6.5,<3.7"  # for omero-py; no Linux wheels on PyPI

# Without this the solver picks the CPU build of PyTorch.
[target.linux-64-cuda.dependencies]
pytorch-gpu = "*"

[pypi-dependencies]
napari-multi-segmenter = { path = "../..", editable = true }
omero-py = "*"
napari-omero = { version = "*", extras = ["all"] }

# ---- AMD Radeon 780M (gfx1103): `pixi install -e therock` ----
# AMD's TheRock nightly wheels, built natively for this GPU. The whole tested nightly
# is pinned; bump all pins together.
[feature.therock]
platforms = ["linux-64-amd"]

[feature.therock.pypi-dependencies]
torch = { version = "==2.15.0+rocm10.3.0a20261115", extras = ["device-gfx1103"] }
torchvision = "==0.30.0a0+rocm10.3.0a20261115"
amd-torch-device-gfx1103 = "==2.15.0+rocm10.3.0a20261115"
rocm = "==10.3.0a20261115"
rocm-sdk-core = "==10.3.0a20261115"
rocm-sdk-libraries = "==10.3.0a20261115"
rocm-sdk-device-gfx1103 = "==10.3.0a20261115"
triton = "==3.9.0+git0a6e13e6.rocm10.3.0a20261115"
napari-multi-segmenter = { path = "../..", editable = true }
omero-py = "*"
napari-omero = { version = "*", extras = ["all"] }
micro-sam = ">=1.9,<2"
napari = { version = ">=0.9,<0.10", extras = ["pyqt6"] }

[feature.therock.pypi-options]
index-url = "https://nightly.repo.amd.com/rocm/whl-next/"
extra-index-urls = ["https://pypi.org/simple"]
index-strategy = "unsafe-best-match"
prerelease-mode = "if-necessary-or-explicit"

[feature.therock.activation]
scripts = ["../activate-therock.sh"]

[feature.therock.dependencies]
python = "3.12.*"
zeroc-ice = ">=3.6.5,<3.7"

[environments]
therock = { features = ["therock"], no-default-feature = true }
