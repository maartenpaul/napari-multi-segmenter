[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "napari-multi-segmenter"
version = "0.0.1"
description = "Experiment: Cellpose 3/4 and StarDist pre-segmentation in napari, each model in its own environment"
requires-python = ">=3.11"
dependencies = ["appose>=0.12,<0.13", "magicgui", "napari", "numpy"]

[project.entry-points."napari.manifest"]
napari-multi-segmenter = "napari_multi_segmenter:napari.yaml"

[tool.hatch.build.targets.wheel]
packages = ["napari_multi_segmenter"]
